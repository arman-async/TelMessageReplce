x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "1m"
        max-file: "3"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 5TOFc9RrotnWvx0
      MYSQL_DATABASE: reguardbot
      MYSQL_USER: bot
      MYSQL_PASSWORD: 5TOFc9GoinWvx0
    command: --max_connections=500
    volumes:
      - db_volume:/var/lib/mysql
    networks:
      - backend
    logging: *default-logging
    
  redis:
    image: redis:8.0.2
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --databases 16
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
    networks:
      - backend
    logging: *default-logging


  app:
    image: reguard-bot:release-V2.11.3
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./.env:/project/.env
      - ./strings.yaml:/project/strings.yaml
    ports:
      - "4800:9000" # dev mode
    networks:
      - backend
    depends_on:
      - db
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  db_volume:
